version: "3.8"
services:
  db:
    platform: linux/x86_64
    image: "mysql:5.7"
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql # Volume pour persister les données de la base
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Mot de passe root
      MYSQL_DATABASE: ${MYSQL_DATABASE} # Nom de la base de données
      #  MYSQL_USER: ${MYSQL_USER} # Nom d'utilisateur
      #MYSQL_PASSWORD: ${MYSQL_PASSWORD} # Mot de passe de l'utilisateur

  backend:
    depends_on:
      - db
    build: ./back
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
      JWT_SECRET: ${JWT_SECRET} # Clé secrète pour JWT
    ports:
      - 3001:3001

  frontend:
    depends_on:
      - db
    build: ./front
    ports:
      - 4200:80

volumes:
  db-data:
