version: "3.3"

services:
  mysql:
    image: mysql:5.7
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Mot de passe root
      MYSQL_DATABASE: ${MYSQL_DATABASE} # Nom de la base de données
      MYSQL_USER: ${MYSQL_USER} # Nom d'utilisateur
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} # Mot de passe de l'utilisateur
    ports:
      - "3306:3306" # Exposer le port 3306 pour l'accès local
    volumes:
      - mysql-data:/var/lib/mysql # Volume pour persister les données
    networks:
      - project-network

  backend:
    build:
      context: ./back # Chemin vers le backend
    container_name: springboot-container
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET} # Clé secrète pour JWT
    ports:
      - "8080:8080" # Exposer le port 8080
    depends_on:
      - mysql # Démarrer MySQL avant le backend
    networks:
      - project-network

  frontend:
    build:
      context: ./front # Chemin vers le frontend
    container_name: angular-container
    ports:
      - "4200:4200" # Exposer le port 4200
    depends_on:
      - backend # Démarrer le backend avant le frontend
    networks:
      - project-network

volumes:
  mysql-data: # Volume pour les données MySQL

networks:
  project-network:
    driver: bridge
